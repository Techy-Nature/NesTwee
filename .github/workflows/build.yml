name: Build apps

# Builds NesTwee for Windows, macOS and Linux, plus the Android phone and
# tablet apps (.apk).
# - Every push and pull request: runs the tests and uploads the apps as
#   downloadable artifacts (Actions tab → this run → "Artifacts").
# - Every push to main: also updates the "Latest build" pre-release
#   (tag latest) with the newest apps.
# - Pushing a tag like v0.1.0: also attaches the apps to a GitHub Release.
# - You can also start it by hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the app
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # The apps aren't code-signed yet, so skip looking for certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: NesTwee-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  android:
    name: Android (phone + tablet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already include the Android SDK
      # (ANDROID_HOME); Gradle fetches any missing platform it needs.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the phone and tablet apps
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          chmod +x android/gradlew
          for VARIANT in phone tablet; do
            node mobile/build.mjs "$VARIANT"
            npx cap sync android
            (cd android && ./gradlew --no-daemon clean assembleDebug \
              -PnestweeVariant="$VARIANT" \
              -PnestweeVersion="$VERSION" \
              -PnestweeVersionCode="${{ github.run_number }}")
            NAME=NesTwee
            [ "$VARIANT" = tablet ] && NAME=NesTwee-Tablet
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$NAME-$VERSION-android.apk"
          done
          ls -l dist

      - name: Upload the apps
        uses: actions/upload-artifact@v4
        with:
          name: NesTwee-Android
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  # After every merge to main, refresh the "Latest build" pre-release with
  # all the apps, so there's always one place to download the newest build.
  latest:
    name: Update the "Latest build" release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, android]
    runs-on: ubuntu-latest
    concurrency:
      group: latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download the apps from this run
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Move the latest tag to this commit
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Replace the files on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          NOTES="The newest apps built from main (commit ${GITHUB_SHA::7}). This release is replaced after every merge, so it may be ahead of the numbered releases."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest build (main)" --notes "$NOTES" --prerelease
            # Remove the previous build's files so only the newest ones are listed.
            gh release view latest --json assets --jq '.assets[].name' | while read -r name; do
              gh release delete-asset latest "$name" --yes
            done
          else
            gh release create latest --title "Latest build (main)" --notes "$NOTES" --prerelease --verify-tag
          fi
          gh release upload latest dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb dist/*.apk --clobber
