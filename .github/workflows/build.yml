name: Build apps

# Builds NesTwee for Windows, macOS and Linux.
# - Every push and pull request: runs the tests and uploads the apps as
#   downloadable artifacts (Actions tab → this run → "Artifacts").
# - Pushing a tag like v0.1.0: also attaches the apps to a GitHub Release.
# - You can also start it by hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the app
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # The apps aren't code-signed yet, so skip looking for certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: NesTwee-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
